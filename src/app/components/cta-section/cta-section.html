<section id="contact" class="cta-section">
  <div class="container-small cta-content">
    <h2 class="cta-title">{{ title }}</h2>
    <p>{{ text }}</p>
    <div class="btn-container">
      <button class="btn btn-white btn-lg" (click)="onBtnClick(btn1)">{{ btn1 }}</button>
      <button class="btn btn-outline btn-lg" (click)="onBtnClick(btn2)">{{ btn2 }}</button>
    </div>
  </div>
</section>
